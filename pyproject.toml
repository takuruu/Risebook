[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "risebook"
version = "0.1.0"
description = "Interactive plain text accounting: record transactions into a ledger journal."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "takuruu" }]
keywords = ["plain-text-accounting", "ledger", "accounting"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: Office/Business :: Financial :: Accounting",
]

[project.scripts]
risebook = "risebook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
